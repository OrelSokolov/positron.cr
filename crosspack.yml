# crosspack — build orchestration for the Positron shard.
#
#   crosspack deps              # verify/install this host's build deps
#   crosspack build             # specs + CLI + all examples -> builds/
#   crosspack pack              # package builds/ -> crosspacks/ (MSI on
#                               # Windows via WiX, deb/rpm on Linux)
#   crosspack resolve <target>  # runtime Depends line for a target
#
# The version follows shard.yml — bump both together.

name: positron
version: 0.1.0

build:
  output: builds

  # Host-axis build dependencies: what the build machine needs (dev
  # packages, the compiler). The top-level deps: section below is the
  # runtime axis. Host selectors: distro id from /etc/os-release, then
  # ID_LIKE tokens (ubuntu hits the debian rule), then os, then "*".
  # sqlite3 (opt-in plugin) is intentionally absent — crosspack deps has
  # no "optional" concept and the default matrix builds without it.
  deps:
    crystal:
      hosts:
        debian:
          verify: crystal --version
          install: curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        fedora:
          verify: crystal --version
          install: sudo dnf install -y crystal
        arch:
          verify: crystal --version
          install: sudo pacman -S --needed crystal
        "*":
          verify: crystal --version

    gtk3-dev:
      hosts:
        debian:
          verify: pkg-config --exists gtk+-3.0
          install: sudo apt-get install -y libgtk-3-dev
        fedora:
          verify: pkg-config --exists gtk+-3.0
          install: sudo dnf install -y gtk3-devel
        arch:
          verify: pkg-config --exists gtk+-3.0
          install: sudo pacman -S --needed gtk3
        windows:
          verify: exit 0 # stubs-only build — the GTK stack is not linked on Windows
        darwin:
          verify: exit 0 # macOS adapter uses the system AppKit — no GTK stack
        "*":
          verify: pkg-config --exists gtk+-3.0

    webkit2gtk-4.1-dev:
      hosts:
        debian:
          verify: pkg-config --exists webkit2gtk-4.1
          install: sudo apt-get install -y libwebkit2gtk-4.1-dev
        fedora:
          verify: pkg-config --exists webkit2gtk-4.1
          install: sudo dnf install -y webkit2gtk4.1-devel
        arch:
          verify: pkg-config --exists webkit2gtk-4.1
          install: sudo pacman -S --needed webkit2gtk-4.1
        windows:
          verify: exit 0 # stubs-only build — the GTK stack is not linked on Windows
        darwin:
          verify: exit 0 # macOS adapter uses the system WebKit — no WebKitGTK
        "*":
          verify: pkg-config --exists webkit2gtk-4.1

    ayatana-appindicator3-dev:
      hosts:
        debian:
          verify: pkg-config --exists ayatana-appindicator3-0.1
          install: sudo apt-get install -y libayatana-appindicator3-dev
        fedora:
          verify: pkg-config --exists ayatana-appindicator3-0.1
          install: sudo dnf install -y libayatana-appindicator3-devel
        arch:
          verify: pkg-config --exists ayatana-appindicator3-0.1
          install: sudo pacman -S --needed libayatana-appindicator
        windows:
          verify: exit 0 # stubs-only build — the GTK stack is not linked on Windows
        darwin:
          verify: exit 0 # macOS adapter uses NSStatusItem — no AppIndicator
        "*":
          verify: pkg-config --exists ayatana-appindicator3-0.1

    libnotify-dev:
      hosts:
        debian:
          verify: pkg-config --exists libnotify
          install: sudo apt-get install -y libnotify-dev
        fedora:
          verify: pkg-config --exists libnotify
          install: sudo dnf install -y libnotify-devel
        arch:
          verify: pkg-config --exists libnotify
          install: sudo pacman -S --needed libnotify
        windows:
          verify: exit 0 # stubs-only build — the GTK stack is not linked on Windows
        darwin:
          verify: exit 0 # macOS notifications use UNUserNotificationCenter
        "*":
          verify: pkg-config --exists libnotify

  matrix:
    - id: linux
      build: linux/amd64
      steps:
        - crystal spec          # specs must pass — same gate as CI
        - rake build:cli        # bin/positron
        - rake build:examples   # examples/<name>/<name>, logs to logs/
        - cp examples/hello/hello examples/clipboard/clipboard examples/display_info/display_info examples/file_picker/file_picker examples/keyboard_demo/keyboard_demo examples/save_file_dialog/save_file_dialog examples/system_notifications/system_notifications examples/theme_demo/theme_demo bin/
      artifacts:
        from: bin
        include: ["*"]
        to: [debian-12, ubuntu-22.04, ubuntu-24.04, ubuntu-25.10, fedora-41, arch]

    # Windows builds against the adapter stubs (same as the CI windows job):
    # no GTK/WebKitGTK stack — the Linux C libraries never reach the link
    # line. Steps run under cmd.exe; mode: copy because symlinks need
    # developer mode on Windows. crystal build drops the runtime DLLs
    # (gc.dll, libcrypto, ...) next to each .exe, so the fan-in copies
    # *.exe and *.dll into bin/.
    - id: windows
      build: windows/amd64
      steps:
        - crystal spec          # specs must pass — same gate as CI
        - rake build:cli        # bin/positron.exe
        - rake build:examples   # examples/<name>/<name>.exe, logs to logs/
        - copy /y third_party\webview\webview.dll bin\
        - 'for /d %d in (examples\*) do @copy /y "%d\*.exe" bin\'
        - 'for /d %d in (examples\*) do @copy /y "%d\*.dll" bin\'
      artifacts:
        from: bin
        include: ["*.exe", "*.dll"]
        to: [windows-11.0]
        mode: copy

    # macOS (arm64) builds the real WKWebView/NSStatusItem adapters and
    # the UNUserNotificationCenter notifications plugin against the
    # system frameworks — no pkg-config stack (see the darwin host rules
    # above). crystal build drops *.dwarf debug files next to the
    # binaries; they are removed so they stay out of the artifacts.
    - id: macos
      build: darwin/arm64
      steps:
        - crystal spec          # specs must pass — same gate as CI
        - rake build:cli        # bin/positron
        - rake build:examples   # examples/<name>/<name>, logs to logs/
        - rm -f examples/*/*.dwarf bin/*.dwarf
        - cp examples/hello/hello examples/clipboard/clipboard examples/display_info/display_info examples/file_picker/file_picker examples/keyboard_demo/keyboard_demo examples/save_file_dialog/save_file_dialog examples/system_notifications/system_notifications examples/theme_demo/theme_demo bin/
      artifacts:
        from: bin
        include: ["*"]
        to: [macos]

# Distribution: what `crosspack pack` ships — the positron CLI plus the
# example apps and the runtime DLLs they need (Windows flat under
# Program Files via WiX MSI; Linux under /usr/lib/positron with symlinks
# in /usr/bin). Payload keys are the common names; selectors map them to
# the real file names each target's build produced.
package:
  maintainer: Oleg Orlov <orelcokolov@gmail.com>
  description: |
    Positron — desktop app framework in the spirit of Wails
    (Crystal host + system WebView). This package carries the positron
    CLI and the example apps demonstrating the plugin surface.
  sources: builds
  prefix: usr
  lib_dir: lib/positron
  license: MIT
  payload:
    positron: { linux: positron, windows: positron.exe }
    hello: { linux: hello, windows: hello.exe }
    clipboard: { linux: clipboard, windows: clipboard.exe }
    display_info: { linux: display_info, windows: display_info.exe }
    file_picker: { linux: file_picker, windows: file_picker.exe }
    keyboard_demo: { linux: keyboard_demo, windows: keyboard_demo.exe }
    save_file_dialog: { linux: save_file_dialog, windows: save_file_dialog.exe }
    system_notifications: { linux: system_notifications, windows: system_notifications.exe }
    theme_demo: { linux: theme_demo, windows: theme_demo.exe }
    gc.dll: { windows: gc.dll }
    iconv-2.dll: { windows: iconv-2.dll }
    libcrypto-3-x64.dll: { windows: libcrypto-3-x64.dll }
    libssl-3-x64.dll: { windows: libssl-3-x64.dll }
    pcre2-8.dll: { windows: pcre2-8.dll }
    zlib1.dll: { windows: zlib1.dll }
    webview.dll: { windows: webview.dll }
  executables: [hello, positron, clipboard, display_info, file_picker,
                keyboard_demo, save_file_dialog, system_notifications,
                theme_demo]
  links:
    bin/positron: ../lib/positron/positron
  desktop:
    name: Positron Hello
    comment: Positron example app (Crystal host + WebView2)
    categories: Development;

# Runtime-axis dependencies: the native libraries a Positron application
# links at run time, per distro family. Linux only — the framework's
# working platform (macos/windows adapters are stubs).
deps:
  version: 1
  gtk3:
    targets:
      debian: { "*": [libgtk-3-0] }
      ubuntu: { "*": [libgtk-3-0] }
      fedora: { "*": [gtk3] }
      arch: { "*": [gtk3] }
  webkit2gtk:
    targets:
      debian:
        "12": [libwebkit2gtk-4.1-0, libwebkit2gtk-4.0-37]  # deb alternatives
        "13": [libwebkit2gtk-4.1-0]
      ubuntu:
        "22.04": [libwebkit2gtk-4.1-0, libwebkit2gtk-4.0-37]
        "*": [libwebkit2gtk-4.1-0]
      fedora: { "*": [webkit2gtk4.1] }
      arch: { "*": [webkit2gtk-4.1] }
  ayatana-appindicator:
    targets:
      debian: { "*": [libayatana-appindicator3-1] }
      ubuntu: { "*": [libayatana-appindicator3-1] }
      fedora: { "*": [libayatana-appindicator3] }
      arch: { "*": [libayatana-appindicator] }
  libnotify:                # not in crosspack's canonical list — resolves fine
    targets:
      debian: { "*": [libnotify4] }
      ubuntu: { "*": [libnotify4] }
      fedora: { "*": [libnotify] }
      arch: { "*": [libnotify] }
