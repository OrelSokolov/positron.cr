name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux is the fully supported platform (real GTK/WebKitGTK
        # adapters); macOS builds the real WKWebView/NSStatusItem
        # adapters (pure-Crystal ObjC runtime layer), Windows builds
        # against the adapter stubs.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libnotify-dev \
            libsqlite3-dev

      # Unix-gated plugins link native libraries on macOS too:
      # secure_storage links OpenSSL (brew's keg-only openssl@3 needs an
      # explicit PKG_CONFIG_PATH), the SQLite spec links the system
      # libsqlite3. GTK/WebKitGTK are NOT needed: macOS builds against
      # the adapter stubs until M5 lands.
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      # Windows builds against the adapter stubs only: unix-only plugins
      # (deep_links, secure_storage) and the SQLite spec are flag-gated
      # out, so no native dependencies are required. WebView2 / OpenSSL
      # dependencies get added here together with the M5 adapters.

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Spec
        run: crystal spec --no-color

      # No single binary: every example in examples/<name>/<name>.cr is an
      # app of its own, so just build them all (mirrors `rake build:examples`,
      # in bash so the same step works on all three runners).
      - name: Build examples
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for dir in examples/*/; do
            name="$(basename "$dir")"
            src="examples/$name/$name.cr"
            [ -f "$src" ] || continue
            echo "::group::Build $name"
            if crystal build "$src" -o "examples/$name/$name" --no-color; then
              echo "$name: OK"
            else
              echo "$name: FAILED"
              status=1
            fi
            echo "::endgroup::"
          done

          # The CLI links no GUI stack — must build on every runner.
          echo "::group::Build positron CLI"
          mkdir -p bin
          if crystal build src/positron/cli.cr -o bin/positron --no-color; then
            echo "positron: OK"
          else
            echo "positron: FAILED"
            status=1
          fi
          echo "::endgroup::"
          exit $status
