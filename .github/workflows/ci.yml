name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux is the fully supported platform (real GTK/WebKitGTK
        # adapters); Windows and macOS build against the adapter stubs.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libnotify-dev

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Spec
        run: crystal spec --no-color

      # No single binary: every example in examples/<name>/<name>.cr is an
      # app of its own, so just build them all (mirrors `rake build:examples`,
      # in bash so the same step works on all three runners).
      - name: Build examples
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for dir in examples/*/; do
            name="$(basename "$dir")"
            src="examples/$name/$name.cr"
            [ -f "$src" ] || continue
            echo "::group::Build $name"
            if crystal build "$src" -o "examples/$name/$name" --no-color; then
              echo "$name: OK"
            else
              echo "$name: FAILED"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
